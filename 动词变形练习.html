/* ============ 活用引擎 ============ */
var KANA_RE = /[\u3040-\u30ffー]/;
function conj(dict, type){
  var tail = dict.slice(-1);
  var stem = dict.slice(0, -1);
  var c = {};
  if (type === '3'){
    if (dict === 'する' || dict.endsWith('する')){
      var s = dict.slice(0, -2);
      c.masu = s + 'します'; c.masen = s + 'しません'; c.mashita = s + 'しました';
      c.masendeshita = s + 'しませんでした';
      c.te = s + 'して'; c.ta = s + 'した'; c.nai = s + 'しない'; c.nakatta = s + 'しなかった';
      c.ba = s + 'すれば'; c.tara = s + 'したら'; c.kanou = s + 'できます';
      c.ukemi = s + 'されます'; c.shieki = s + 'させます'; c.shieki_ukemi = s + 'させられます';
      c.meirei = s + 'しろ'; c.mashou = s + 'しましょう'; c.tai = s + 'したい'; c.takatta = s + 'したかった';
    } else if (dict === '来る' || dict === 'くる'){
      var k = dict.slice(0, -1);
      c.masu = k + 'きます'; c.masen = k + 'きません'; c.mashita = k + 'きました';
      c.masendeshita = k + 'きませんでした';
      c.te = k + 'きて'; c.ta = k + 'きた'; c.nai = k + 'こない'; c.nakatta = k + 'こなかった';
      c.ba = k + 'くれば'; c.tara = k + 'きたら'; c.kanou = k + 'こられます';
      c.ukemi = k + 'こられます'; c.shieki = k + 'こさせます'; c.shieki_ukemi = k + 'こさせられます';
      c.meirei = k + 'こい'; c.mashou = k + 'きましょう'; c.tai = k + 'きたい'; c.takatta = k + 'きたかった';
    } else { c.masu = dict; }
    return c;
  }
  if (type === '2'){
    c.masu = stem + 'ます'; c.masen = stem + 'ません'; c.mashita = stem + 'ました';
    c.masendeshita = stem + 'ませんでした';
    c.te = stem + 'て'; c.ta = stem + 'た'; c.nai = stem + 'ない'; c.nakatta = stem + 'なかった';
    c.ba = stem + 'れば'; c.tara = stem + 'たら'; c.kanou = stem + 'られます';
    c.ukemi = stem + 'られます'; c.shieki = stem + 'させます'; c.shieki_ukemi = stem + 'させられます';
    c.meirei = stem + 'ろ'; c.mashou = stem + 'ましょう'; c.tai = stem + 'たい'; c.takatta = stem + 'たかった';
    return c;
  }
  var naiStem = '';
  if (dict === 'ある'){ naiStem = 'な'; c.nai = 'ない'; c.nakatta = 'なかった'; }
  else if (dict === 'くれる'){ naiStem = 'くれ'; c.nai = 'くれない'; c.nakatta = 'くれなかった'; }
  else {
    var aMap = {'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
    var aK = aMap[tail] || 'あ';
    c.nai = stem + aK + 'ない'; c.nakatta = stem + aK + 'なかった';
    naiStem = stem + aK;
  }
  var teTa = {'く':'いて','ぐ':'いで','う':'って','つ':'って','る':'って','む':'んで','ぶ':'んで','ぬ':'んで','す':'して'};
  if ((dict === '行く') || (dict === 'いく')){ c.te = '行って'; c.ta = '行った'; }
  else if ((dict === '逝く') || (dict === 'いく')){ c.te = '逝って'; c.ta = '逝った'; }
  else {
    var tt = teTa[tail] || 'って';
    c.te = stem + tt; c.ta = stem + tt.slice(0, -1) + 'た';
  }
  var eMap = {'う':'え','く':'け','ぐ':'げ','す':'せ','つ':'て','ぬ':'ね','ぶ':'べ','む':'め','る':'れ'};
  var eK = eMap[tail] || tail;
  c.ba = stem + eK + 'ば';
  c.meirei = stem + eK;
  c.kanou = (tail === 'す') ? (stem + 'せる') : (stem + eK + 'る');
  c.ukemi = naiStem + 'れる';
  c.shieki = naiStem + 'せる';
  c.shieki_ukemi = naiStem + 'せられる';
  c.masu = stem + {'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'}[tail] + 'ます';
  c.masen = c.masu.slice(0, -2) + 'ません';
  c.mashita = c.masu.slice(0, -2) + 'ました';
  c.masendeshita = c.masu.slice(0, -2) + 'ませんでした';
  c.mashou = c.masu.slice(0, -2) + 'ましょう';
  c.tai = c.masu.slice(0, -2) + 'たい';
  c.takatta = c.masu.slice(0, -2) + 'たかった';
  c.tara = c.ta + 'ら';
  return c;
}

/* ============ 汉字->假名映射 ============ */
function buildMap(word, kana){
  var map = {}, wp = 0, kp = 0;
  while (wp < word.length && kp < kana.length){
    var ch = word[wp];
    if (KANA_RE.test(ch)){
      if (kana[kp] === ch){ kp++; wp++; }
      else { kp++; }
    } else {
      var start = kp, nx = wp + 1;
      while (nx < word.length && !KANA_RE.test(word[nx])) nx++;
      var nk = nx < word.length ? word[nx] : null;
      while (kp < kana.length && (nk ? kana[kp] !== nk : true)) kp++;
      if (!map[ch]) map[ch] = kana.slice(start, kp);
      wp = nx;
    }
  }
  return map;
}
function kanaize(s, map){
  var out = '';
  for (var i = 0; i < s.length; i++){
    var ch = s[i];
    if (KANA_RE.test(ch)) out += ch;
    else out += (map[ch] || ch);
  }
  return out.replace(/[、。\s]/g, '');
}

/* ============ 渲染 ============ */
var bookSel = document.getElementById('bookSel'), lessonSel = document.getElementById('lessonSel');
var listEl = document.getElementById('list');
var ERR_KEY = 'mn_vb_err';
function errs(){ try { return JSON.parse(localStorage.getItem(ERR_KEY) || '{}'); } catch(e){ return {}; } }
function errTotal(){ var e = errs(), n = 0; for (var k in e) n += e[k]; return n; }
function refreshErr(){ document.getElementById('errCount').textContent = '错题 ' + errTotal(); }
function speak(text, btn){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.9;
  if (btn){
    document.querySelectorAll('.spk.playing').forEach(function(b){ b.classList.remove('playing'); });
    btn.classList.add('playing');
    u.onend = function(){ btn.classList.remove('playing'); };
    u.onerror = function(){ btn.classList.remove('playing'); };
  }
  speechSynthesis.speak(u);
}
var SPK_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/><path d="M14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
function spkBtn(text){
  return '<button type="button" class="spk" data-speak="' + text.replace(/"/g, '&quot;') + '" title="播放日语读音" aria-label="播放日语读音">' + SPK_SVG + '</button>';
}
function fillLesson(){
  var book = +bookSel.value, lesson = +lessonSel.value;
  var les = VERBS[book].filter(function(x){ return x.lesson === lesson; })[0];
  var verbs = les ? les.verbs : [];
  refreshErr();
  if (!verbs.length){
    listEl.innerHTML = '<p class="howto">该课没有动词词条（教材本课无动词）。</p>';
    return;
  }
  document.getElementById('linfo').textContent = '第' + lesson + '課 · ' + verbs.length + ' 个动词 · 看中文提示，在句中空格填入动词的正确变形';
  var html = '';
  verbs.forEach(function(v){
    v.zhs0 = (v.zhs || '').split(/[；;、]/)[0];
    var c = conj(v.dict, v.type);
    var map = buildMap(v.word, v.kana || v.word);
    var typeName = {'1':'一类动词','2':'二类动词','3':'三类动词'}[String(v.type)];
    html += '<section class="lesson">' +
      '<h2 class="lesson-title" data-kana="' + (v.kana || v.word) + '">' + v.word +
      '<span class="l-sub">辞書形：' + v.dict + ' ・ ' + typeName + ' ・ ' + (v.zhs || '') + '</span>' +
      spkBtn(v.word) + '</h2>';
    ['h', 'm', 'l'].forEach(function(fr){
      var items = FORMS.filter(function(f){ return f.freq === fr; });
      if (!items.length) return;
      html += '<div class="sec-title">' + ({h:'常用变形', m:'常用变形', l:'其他变形'})[fr] + '</div>';
      items.forEach(function(f){
        var pairs = f.build(v, c);
        if (!pairs) return;
        pairs.forEach(function(p, pi){
          var sent = p[0], zh = p[1];
          var tail = sent.slice(0, -1).match(/[^、。！\s]+$/)[0];
          if (tail.slice(-1) === 'か') tail = tail.slice(0, -1);
          var formStr = tail;
          var ansK = kanaize(formStr, map);
          var fid = 'l' + lesson + 'w' + v.num + '_' + f.id + '_' + pi;
          var fill = sent.replace(formStr, '<input type="text" class="quiz-input" data-ans="' + ansK + '" data-key="' + fid + '" placeholder="动词" autocomplete="off" autocapitalize="off" spellcheck="false">');
          html += '<div class="dict-item"><div class="prompt"><span class="num">' + f.name + '</span>' + zh + '</div>' +
            '<div class="answer-zone"><div class="quiz">' + fill +
            '<button type="button" class="quiz-check">验证</button>' +
            '<span class="quiz-mark"></span>' +
            '<button type="button" class="reveal">显示答案</button>' +
            spkBtn(sent) +
            '</div><div class="answer"><span class="a-word">' + ansK + '</span></div></div></div>';
        });
      });
    });
    html += '</section>';
  });
  listEl.innerHTML = html;
  bind(listEl);
}
function bind(root){
  root.querySelectorAll('.spk').forEach(function(b){
    b.addEventListener('click', function(){ speak(b.getAttribute('data-speak'), b); });
  });
  root.querySelectorAll('.quiz-input').forEach(function(inp){
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(inp); });
  });
  root.querySelectorAll('.quiz-check').forEach(function(b){
    b.addEventListener('click', function(){ check(b.parentNode.querySelector('.quiz-input')); });
  });
  root.querySelectorAll('.reveal').forEach(function(b){
    b.addEventListener('click', function(){ b.closest('.dict-item').classList.toggle('open'); });
  });
}
var _maps = {};
function kanjiMapFor(inp){
  var key = inp.getAttribute('data-key');
  if (!_maps[key]){
    var title = inp.closest('.lesson').querySelector('.lesson-title');
    var word = title.childNodes[0].textContent;
    _maps[key] = buildMap(word, title.getAttribute('data-kana') || word);
  }
  return _maps[key];
}
function check(inp){
  var v = inp.value.trim();
  var ans = inp.getAttribute('data-ans');
  var key = inp.getAttribute('data-key');
  var item = inp.closest('.dict-item');
  var mark = item.querySelector('.quiz-mark');
  if (!v){ inp.classList.add('bad'); mark.textContent = '请填写'; mark.className = 'quiz-mark bad'; return; }
  var kanaized = kanaize(v, kanjiMapFor(inp));
  var ok = (kanaized.length >= 2 && ans.indexOf(kanaized) === 0) || kanaized.indexOf(ans) >= 0;
  inp.classList.remove('ok', 'bad');
  item.classList.remove('wrong', 'quiz-ok');
  if (ok){
    inp.classList.add('ok'); item.classList.add('quiz-ok');
    mark.textContent = '✓ 正确'; mark.className = 'quiz-mark ok';
  } else {
    inp.classList.add('bad'); item.classList.add('wrong');
    mark.textContent = '✗ 错误'; mark.className = 'quiz-mark bad';
    var e = errs(); e[key] = (e[key] || 0) + 1;
    localStorage.setItem(ERR_KEY, JSON.stringify(e));
    refreshErr();
    item.classList.add('open');
  }
}
function loadLessons(){
  var book = +bookSel.value;
  var html = '';
  VERBS[book].forEach(function(x){
    html += '<option value="' + x.lesson + '">第' + x.lesson + '課</option>';
  });
  lessonSel.innerHTML = html;
  var saved = localStorage.getItem('mn_vb_lesson' + book);
  if (saved && VERBS[book].some(function(x){ return x.lesson === +saved; })) lessonSel.value = saved;
  fillLesson();
}
bookSel.addEventListener('change', function(){
  localStorage.setItem('mn_vb_book', bookSel.value);
  loadLessons();
});
lessonSel.addEventListener('change', function(){
  localStorage.setItem('mn_vb_lesson' + bookSel.value, lessonSel.value);
  fillLesson();
});
document.getElementById('toggleAll').addEventListener('click', function(){
  var on = document.body.classList.toggle('show-answers');
  this.textContent = on ? '全部隐藏答案' : '全部显示答案';
});
document.getElementById('clearErr').addEventListener('click', function(){
  if (!confirm('确认清空全部错题记录？')) return;
  localStorage.removeItem(ERR_KEY); refreshErr();
});
var savedBook = localStorage.getItem('mn_vb_book');
if (savedBook && (savedBook === '1' || savedBook === '2')) bookSel.value = savedBook;
loadLessons();
</script>
