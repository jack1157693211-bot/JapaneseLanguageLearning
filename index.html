<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日语学习 · 入口</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b0341f'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='700'%3E日%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#f6f5f1; --card:#ffffff; --ink:#2e2a26; --ink-soft:#6f6a63;
  --line:#ddd8cf; --accent:#b0341f; --accent-soft:#f7e8e2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Yu Gothic","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  line-height:1.8;font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

.hero{max-width:1000px;margin:0 auto;padding:56px 20px 40px;text-align:center}
.langs{display:inline-flex;gap:6px;margin-bottom:22px;padding:4px;background:var(--card);
  border:1px solid var(--line);border-radius:999px}
.langs button{border:0;background:transparent;color:var(--ink-soft);font-size:13px;
  padding:4px 16px;border-radius:999px;line-height:1.6;transition:background .14s ease,color .14s ease}
.langs button:hover{color:var(--ink)}
.langs button.on{background:var(--accent);color:#fff}
.kicker{display:inline-block;margin:0 0 10px;padding:2px 14px;border:1px solid var(--accent);color:var(--accent);
  border-radius:999px;font-size:13px;letter-spacing:.28em;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif SC",serif}
.hero h1{margin:0;font-size:46px;line-height:1.2;letter-spacing:.06em;font-weight:700;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif SC",serif}
.hero .sub{margin:14px 0 0;color:var(--ink-soft);font-size:15px;letter-spacing:.08em}
.hero .sub b{color:var(--ink);font-weight:600}

main{max-width:1000px;margin:0 auto;padding:8px 20px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}

.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:22px 24px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.10);border-color:#c9c2b4}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .badge{align-self:flex-start;margin-bottom:14px;padding:1px 12px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;letter-spacing:.1em}
.card h2{margin:0;font-size:21px;letter-spacing:.03em}
.card .sub2{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif SC",serif}
.card .range{margin:12px 0 4px;font-size:13.5px;color:var(--ink-soft)}
.card .desc{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft)}
.card .go{margin-top:auto;display:flex;align-items:center;gap:6px;color:var(--accent);
  font-size:14px;font-weight:600;letter-spacing:.05em}
.card .go svg{transition:transform .16s ease}
.card:hover .go svg{transform:translateX(3px)}

.addhint{margin-top:34px;padding:14px 18px;border:1px dashed var(--line);border-radius:10px;
  color:var(--ink-soft);font-size:12.5px;text-align:center}
.addhint code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12px}

footer{border-top:1px solid var(--line);padding:22px 20px 30px;text-align:center;color:var(--ink-soft);font-size:12.5px}
footer .jp{letter-spacing:.2em;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif SC",serif}

@media (max-width:520px){
  .hero{padding:36px 16px 24px}
  .hero h1{font-size:34px}
  main{padding:4px 14px 36px}
}
</style>
</head>
<body>

<header>
  <div class="hero">
    <div class="langs" role="group" aria-label="Language / Ngôn ngữ / 语言">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="vi">Tiếng Việt</button>
    </div>
    <p class="kicker">日本語の勉強</p>
    <h1 data-i18n="heroTitle">日语学习</h1>
    <p class="sub" data-i18n="heroSub">默写 · 听写 · 错题练习<b>入口</b></p>
  </div>
</header>

<main>
  <!-- ===== 页面卡片网格（由下方 PAGES 数组自动渲染） ===== -->
  <div id="grid" class="grid"></div>

  <p class="addhint" data-i18n="addHint">以后新增页面：打开本文件，在底部 <code>PAGES</code> 数组里加一条即可，卡片会自动生成</p>
</main>

<footer>
  <p class="jp">継続は力なり</p>
  <p data-i18n="footerText">日语学习 · 复习工具入口</p>
</footer>

<script>
/* ============================================================
   页面注册表：新增页面只需在此数组追加一条
   { title/sub/range/desc/badge: {zh, en, vi} 或字符串(不随语言变),
     url: 相对文件名 }
   ============================================================ */
const PAGES = [
  {title:{zh:'大家日语1复习', en:'Minna no Nihongo 1 Review', vi:'Minna no Nihongo 1 Ôn tập'},
   sub:'みんなの日本語 初級Ⅰ',
   range:{zh:'第1課 ～ 第25課', en:'Lesson 1 – 25', vi:'Bài 1 – 25'},
   desc:{zh:'单词・文法 默写 / 听写 / 错题本', en:'Vocabulary & grammar · dictation / listening / error book', vi:'Từ vựng & ngữ pháp · chính tả / nghe / sổ lỗi'},
   url:'大家日语1复习.html', badge:{zh:'初级1', en:'Book 1', vi:'Quyển 1'}},
  {title:{zh:'大家日语2复习', en:'Minna no Nihongo 2 Review', vi:'Minna no Nihongo 2 Ôn tập'},
   sub:'みんなの日本語 初級Ⅱ',
   range:{zh:'第26課 ～ 第50課', en:'Lesson 26 – 50', vi:'Bài 26 – 50'},
   desc:{zh:'单词・文法 默写 / 听写 / 错题本', en:'Vocabulary & grammar · dictation / listening / error book', vi:'Từ vựng & ngữ pháp · chính tả / nghe / sổ lỗi'},
   url:'大家日语2复习.html', badge:{zh:'初级2', en:'Book 2', vi:'Quyển 2'}},
];

const I18N = {
  zh:{heroTitle:'日语学习', heroSub:'默写 · 听写 · 错题练习<b>入口</b>',
      addHint:'以后新增页面：打开本文件，在底部 <code>PAGES</code> 数组里加一条即可，卡片会自动生成',
      footerText:'日语学习 · 复习工具入口'},
  en:{heroTitle:'Japanese Study', heroSub:'Dictation · Listening · Error Review <b>Home</b>',
      addHint:'To add a page later: open this file and append one entry to the <code>PAGES</code> array below; the card is generated automatically.',
      footerText:'Japanese Study · Practice Tools Home'},
  vi:{heroTitle:'Học tiếng Nhật', heroSub:'Chính tả · Nghe · Sổ lỗi <b>Trang chủ</b>',
      addHint:'Muốn thêm trang sau này: mở tệp này và thêm một mục vào mảng <code>PAGES</code> bên dưới; thẻ sẽ tự sinh.',
      footerText:'Học tiếng Nhật · Trang chủ công cụ ôn tập'}
};

function pick(v, lang){ return (v && typeof v === 'object' && !Array.isArray(v)) ? (v[lang] || v.zh) : v; }

function render(lang){
  /* 语言按钮高亮 */
  document.querySelectorAll('.langs button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  /* 静态文案 */
  var t = I18N[lang] || I18N.zh;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    if (t[k] !== undefined) el.innerHTML = t[k];
  });
  document.title = t.heroTitle + ' · 入口';
  /* 卡片 */
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  PAGES.forEach(function(p){
    var a = document.createElement('a');
    a.href = p.url;
    a.className = 'card';
    a.setAttribute('aria-label', pick(p.title, lang));
    a.innerHTML =
      '<span class="badge">' + pick(p.badge, lang) + '</span>' +
      '<h2>' + pick(p.title, lang) + '</h2>' +
      '<p class="sub2">' + p.sub + '</p>' +
      '<p class="range">' + pick(p.range, lang) + '</p>' +
      '<p class="desc">' + pick(p.desc, lang) + '</p>' +
      '<span class="go">' + pick({zh:'进入复习页', en:'Open practice', vi:'Vào ôn tập'}, lang) +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
      '</span>';
    grid.appendChild(a);
  });
}

/* 语言切换 + 持久化（localStorage 按域名隔离，本地/Pages 各自记住） */
var LANG_KEY = 'mn_home_lang';
var curLang = localStorage.getItem(LANG_KEY) || 'zh';
if (!I18N[curLang]) curLang = 'zh';
document.querySelectorAll('.langs button').forEach(function(b){
  b.addEventListener('click', function(){
    curLang = b.getAttribute('data-lang');
    localStorage.setItem(LANG_KEY, curLang);
    render(curLang);
  });
});
render(curLang);
</script>
</body>
</html>
